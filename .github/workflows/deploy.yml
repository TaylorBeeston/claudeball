name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # the size check compares the commit with its parent

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Repository size check (no build intermediates, no huge files / commits; docs/repo-size.md)
        run: node tools/repo-diet/check-size.mjs

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # CC0 sky HDRIs from Poly Haven. Cached, and never fatal: without them the engine uses its procedural sky.
      - name: Restore HDRI cache
        id: hdri-cache
        uses: actions/cache@v6
        with:
          path: public/hdri
          key: hdri-${{ hashFiles('scripts/fetch-hdri.mjs') }}

      - name: Fetch HDRIs
        if: steps.hdri-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm run hdri

      - name: Save HDRI cache
        if: steps.hdri-cache.outputs.cache-hit != 'true' && hashFiles('public/hdri/sky_*.hdr') != ''
        uses: actions/cache/save@v6
        with:
          path: public/hdri
          key: hdri-${{ hashFiles('scripts/fetch-hdri.mjs') }}

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build
        env:
          CB_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npx vite build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
