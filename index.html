<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="3D baseball in the browser: two AIs play a full, physically simulated game, shown like a TV broadcast." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f4f4f0' stroke='%23c33' stroke-width='1'/%3E%3C/svg%3E" />
    <title>Claudeball</title>
    <style>
      /* Critical CSS: the loading screen paints before any script runs. Design tokens are shared with src/ui/ui.css. */
      :root {
        --cb-bg: #05070a;
        --cb-text: #f4f6f8;
        --cb-dim: rgba(244, 246, 248, 0.62);
        --cb-gold: #ffcf4a;
        --cb-red: #e5463b;
        --cb-line: rgba(255, 255, 255, 0.14);
        --cb-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --cb-display: "Barlow Condensed", "Oswald", "Bebas Neue", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Impact, sans-serif;
        --cb-sat: env(safe-area-inset-top, 0px);
        --cb-sar: env(safe-area-inset-right, 0px);
        --cb-sab: env(safe-area-inset-bottom, 0px);
        --cb-sal: env(safe-area-inset-left, 0px);
      }
      html, body { margin: 0; height: 100%; background: var(--cb-bg); overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; color: var(--cb-text); font-family: var(--cb-font); }
      #app { position: fixed; inset: 0; }
      #cb-boot { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(120% 90% at 50% 100%, #14233a 0%, #0a111b 45%, #05070a 100%); transition: opacity 0.6s ease, visibility 0.6s; }
      #cb-boot.instant { transition: none; }
      #cb-boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
      #cb-boot .bg { position: absolute; inset: 0; pointer-events: none; }
      #cb-boot .glow { position: absolute; left: 50%; bottom: -10%; width: 140vmax; height: 70vmax; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255, 214, 140, 0.22), rgba(255, 214, 140, 0) 70%); animation: cb-drift 14s ease-in-out infinite alternate; }
      #cb-boot .beam { position: absolute; top: -20%; bottom: -20%; width: 28vmax; left: -40%; transform: skewX(-18deg); background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 244, 214, 0.07), rgba(255, 255, 255, 0)); animation: cb-sweep 9s linear infinite; }
      #cb-boot svg.sky { position: absolute; left: 0; bottom: 0; width: 100%; height: 46%; min-height: 160px; }
      #cb-boot .center { position: relative; width: min(440px, 86vw); padding: 0 var(--cb-sal) 0 var(--cb-sar); text-align: center; }
      #cb-boot .logo { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 26px; }
      #cb-boot .logo svg { width: clamp(44px, 9vmin, 64px); height: auto; filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.6)); animation: cb-spin 6s linear infinite; }
      #cb-boot h1 { margin: 0; font: italic 800 clamp(40px, 9vmin, 68px)/1 var(--cb-display); letter-spacing: 0.04em; text-transform: uppercase; text-shadow: 0 3px 18px rgba(0, 0, 0, 0.6); }
      #cb-boot h1 b { color: var(--cb-gold); font-weight: 800; }
      #cb-boot .bar { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
      #cb-boot .bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(0.02); transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1); border-radius: 6px; background: linear-gradient(90deg, #ffb42e, var(--cb-gold)); box-shadow: 0 0 14px rgba(255, 207, 74, 0.6); }
      #cb-boot .stage { margin: 14px 0 0; font-size: 15px; letter-spacing: 0.06em; color: var(--cb-dim); min-height: 1.4em; }
      #cb-boot .note { margin: 10px 0 0; font-size: 13px; line-height: 1.45; color: var(--cb-gold); }
      #cb-boot .retry { margin-top: 18px; font: 700 16px var(--cb-font); letter-spacing: 0.04em; color: #111; background: var(--cb-gold); border: 0; border-radius: 10px; padding: 12px 26px; min-height: 44px; cursor: pointer; }
      #cb-boot.fail .bar i { background: var(--cb-red); box-shadow: 0 0 14px rgba(229, 70, 59, 0.6); }
      #cb-boot [hidden] { display: none; }
      #cb-boot.fail .logo svg { animation: none; }
      @keyframes cb-drift { from { transform: translateX(-56%) scale(1); opacity: 0.8; } to { transform: translateX(-44%) scale(1.12); opacity: 1; } }
      @keyframes cb-sweep { from { left: -40%; } to { left: 120%; } }
      @keyframes cb-spin { to { transform: rotate(360deg); } }
      @keyframes cb-twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      #cb-boot .lamp { animation: cb-twinkle 3.4s ease-in-out infinite; }
      #cb-boot .lamp:nth-of-type(2n) { animation-delay: -1.1s; }
      @media (prefers-reduced-motion: reduce) {
        #cb-boot .glow, #cb-boot .beam, #cb-boot .logo svg, #cb-boot .lamp { animation: none; }
        #cb-boot .bar i, #cb-boot { transition-duration: 0.01s; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="cb-boot" role="status" aria-live="polite" aria-label="Loading Claudeball">
      <div class="bg">
        <div class="glow"></div>
        <div class="beam"></div>
        <!-- stadium silhouette: the bowl, the outfield wall and four light towers with glowing lamp banks -->
        <svg class="sky" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <defs>
            <linearGradient id="cb-bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1522" /><stop offset="1" stop-color="#05080d" /></linearGradient>
            <filter id="cb-bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" /></filter>
          </defs>
          <path d="M0 300V196Q150 140 330 150L870 150Q1050 140 1200 196V300Z" fill="url(#cb-bowl)" />
          <path d="M0 300V232Q300 190 600 190T1200 232V300Z" fill="#04060a" />
          <g stroke="#0a111b" stroke-width="5"><path d="M170 160V58M440 150V44M760 150V44M1030 160V58" /></g>
          <g fill="#fff3cf">
            <g class="lamp"><rect x="150" y="40" width="40" height="22" rx="2" filter="url(#cb-bloom)" opacity=".9" /><rect x="152" y="44" width="36" height="14" rx="2" /></g>
            <g class="lamp"><rect x="420" y="26" width="40" height="22" rx="2" filter="url(#cb-bloom)" opacity=".9" /><rect x="422" y="30" width="36" height="14" rx="2" /></g>
            <g class="lamp"><rect x="740" y="26" width="40" height="22" rx="2" filter="url(#cb-bloom)" opacity=".9" /><rect x="742" y="30" width="36" height="14" rx="2" /></g>
            <g class="lamp"><rect x="1010" y="40" width="40" height="22" rx="2" filter="url(#cb-bloom)" opacity=".9" /><rect x="1012" y="44" width="36" height="14" rx="2" /></g>
          </g>
        </svg>
      </div>
      <div class="center">
        <div class="logo">
          <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#f4f4f0" stroke="#cfcfc8" stroke-width="2" /><path d="M14 12C24 22 24 42 14 52M50 12C40 22 40 42 50 52" fill="none" stroke="#d63a30" stroke-width="2.6" stroke-linecap="round" /><path d="M16 18l6 2M17 25l6 1M18 32h6M17 39l6-1M16 46l6-2M48 18l-6 2M47 25l-6 1M46 32h-6M47 39l-6-1M48 46l-6-2" stroke="#d63a30" stroke-width="2" stroke-linecap="round" /></svg>
          <h1>Claude<b>ball</b></h1>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
        <p class="stage">Starting…</p>
        <p class="note" hidden></p>
        <button class="retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <noscript><p style="position:fixed;inset:auto 0 20% 0;text-align:center;z-index:101;color:#fff;font:16px system-ui">Claudeball needs JavaScript and a WebGL2-capable browser.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
